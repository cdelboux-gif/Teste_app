name: Deploy Backend to AWS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-aws.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::856073125487:role/vitapoint-production-github-deploy
  ECR_REPOSITORY: vitapoint-production-api
  ECS_CLUSTER: vitapoint-production-cluster
  ECS_SERVICE: vitapoint-production-api
  CONTAINER_NAME: api
  API_URL: https://djns4j8rrptkg.cloudfront.net

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" backend
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition vitapoint-production-api \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Start production service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 1 \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify production service
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition}'

      - name: Smoke test public API through HTTPS
        shell: bash
        run: |
          echo "Public HTTPS API URL: $API_URL"

          for attempt in $(seq 1 18); do
            echo "Health check attempt $attempt/18"
            if body=$(curl --silent --show-error --fail --max-time 10 "$API_URL/health"); then
              echo "$body"
              echo "$body" | grep -q '"status":"ok"'
              echo "Public HTTPS API health check passed."
              curl --silent --show-error --fail --max-time 10 "$API_URL/ready"
              echo
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo '::error::Public HTTPS API health check failed through CloudFront.'
              exit 1
            fi
            sleep 10
          done

      - name: Verify auth route and production database connectivity
        shell: bash
        run: |
          # A nonexistent user must return 401. Reaching that response proves the
          # public auth route is working and the API successfully queried PostgreSQL.
          status=$(curl --silent --show-error --output /tmp/auth-response.json \
            --write-out '%{http_code}' --max-time 15 \
            -H 'Content-Type: application/json' \
            -d '{"email":"production-smoke-test-not-a-user@vitapoint.invalid","password":"not-a-real-password"}' \
            "$API_URL/auth/login")
          cat /tmp/auth-response.json
          echo
          if [ "$status" != "401" ]; then
            echo "::error::Expected /auth/login to return 401 for a nonexistent user, got HTTP $status."
            exit 1
          fi
          echo 'Auth route and PostgreSQL query path passed.'
