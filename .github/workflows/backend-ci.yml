name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitapoint
          POSTGRES_PASSWORD: vitapoint
          POSTGRES_DB: vitapoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vitapoint -d vitapoint"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: postgresql+psycopg://vitapoint:vitapoint@localhost:5432/vitapoint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate imports
        run: python -c "from app.main import app; print(app.title)"

      - name: Compile Python sources
        run: python -m compileall -q app tests alembic

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Validate migration rollback
        run: alembic downgrade base

      - name: Reapply database migrations
        run: alembic upgrade head

      - name: Run test suite
        run: python -m pytest -q
