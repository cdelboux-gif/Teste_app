name: AWS Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY or APLICAR to provision the MVP AWS infrastructure'
        required: true
        default: 'PLAN'

permissions:
  contents: read

env:
  AWS_REGION: sa-east-1
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform:
    name: Bootstrap AWS infrastructure
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate bootstrap secrets
        shell: bash
        env:
          BOOTSTRAP_ACCESS_KEY_ID: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          BOOTSTRAP_SECRET_ACCESS_KEY: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$BOOTSTRAP_ACCESS_KEY_ID" ]; then
            echo '::error::AWS_BOOTSTRAP_ACCESS_KEY_ID is missing from the production environment secrets.'
            exit 1
          fi
          if [ -z "$BOOTSTRAP_SECRET_ACCESS_KEY" ]; then
            echo '::error::AWS_BOOTSTRAP_SECRET_ACCESS_KEY is missing from the production environment secrets.'
            exit 1
          fi
          echo 'Bootstrap AWS secrets are present.'

      - name: Configure temporary bootstrap AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.confirm == 'APPLY' || github.event.inputs.confirm == 'APLICAR' }}
        run: terraform apply -auto-approve tfplan

      - name: Show deployment outputs
        if: ${{ github.event.inputs.confirm == 'APPLY' || github.event.inputs.confirm == 'APLICAR' }}
        run: |
          echo 'API URL:'
          terraform output -raw api_url
          echo
          echo 'GitHub deploy role ARN:'
          terraform output -raw github_deploy_role_arn
          echo
