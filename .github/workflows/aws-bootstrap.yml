name: AWS Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY or APLICAR to provision the MVP AWS infrastructure'
        required: true
        default: 'PLAN'

permissions:
  contents: read

env:
  AWS_REGION: sa-east-1
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform:
    name: Bootstrap AWS infrastructure
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate bootstrap secrets
        shell: bash
        env:
          BOOTSTRAP_ACCESS_KEY_ID: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          BOOTSTRAP_SECRET_ACCESS_KEY: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
        run: |
          test -n "$BOOTSTRAP_ACCESS_KEY_ID" || { echo '::error::AWS_BOOTSTRAP_ACCESS_KEY_ID is missing.'; exit 1; }
          test -n "$BOOTSTRAP_SECRET_ACCESS_KEY" || { echo '::error::AWS_BOOTSTRAP_SECRET_ACCESS_KEY is missing.'; exit 1; }

      - name: Configure temporary bootstrap AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Prepare persistent Terraform state bucket
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="vitapoint-${ACCOUNT_ID}-terraform-state"
          echo "STATE_BUCKET=$STATE_BUCKET" >> "$GITHUB_ENV"
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "$STATE_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Terraform init with persistent backend
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"

      - name: Recover resources from interrupted bootstrap
        shell: bash
        run: |
          chmod +x ./recover-existing.sh
          ./recover-existing.sh

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.confirm == 'APPLY' || github.event.inputs.confirm == 'APLICAR' }}
        run: terraform apply -auto-approve tfplan

      - name: Show deployment outputs
        if: ${{ github.event.inputs.confirm == 'APPLY' || github.event.inputs.confirm == 'APLICAR' }}
        run: |
          echo 'API HTTP URL:'
          terraform output -raw api_url
          echo
          echo 'API HTTPS URL:'
          terraform output -raw api_https_url
          echo
          echo 'GitHub deploy role ARN:'
          terraform output -raw github_deploy_role_arn
          echo
